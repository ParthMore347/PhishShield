<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Shield Glow -->
  <polygon points="50,6 92,26 92,72 50,96 8,72 8,26" fill="rgba(6, 182, 212, 0.25)" filter="url(#glow)"/>
  <!-- Primary Shield Geometry -->
  <polygon points="50,10 88,28 88,70 50,92 12,70 12,28" fill="url(#shieldGrad)" stroke="#38bdf8" stroke-width="2.5"/>
  <!-- Cyber Circuit Lines -->
  <path d="M50,22 L50,80 M28,42 L50,56 L72,42" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9"/>
  <circle cx="50" cy="56" r="4.5" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>
</svg>
